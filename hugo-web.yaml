# hugo-web.yaml — the Linny web-view config (SEPARATE from the linny.vim indexer
# in config/). Serve it with `--configDir doesnotexist` so the JSON-indexer config
# is NOT merged. See start-web.sh (or ./RUNME.sh web).
#
# The look, geekdoc params and the two overview pages come from the linny-web-theme
# Hugo module. Hugo only merges `params` from a theme, so the site-level config
# below (taxonomies, menu, markup, frontmatter, pagination, enableGitInfo) must
# live here — that's why the template ships a complete file.

title: "My Linny Notes"
baseURL: "http://localhost:9999/"
languageCode: "nl-nl"

# Git-based "Updated on …" date. Works when notes are committed and built in place.
enableGitInfo: true

# Taxonomies a Linny notebook uses.
taxonomies:
  tags: "tags"
  project: "project"
  customer: "customer"
  type: "type"

# Top menu: the four taxonomy landing pages.
menu:
  main:
    - identifier: customers
      name: Customers
      url: /customer/
      weight: 10
    - identifier: projects
      name: Projects
      url: /project/
      weight: 20
    - identifier: types
      name: Types
      url: /type/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40

# HTML web view; JSON on the home page for tooling parity.
outputs:
  home: [html, json]
  page: [html]
  taxonomy: [html]
  term: [html]

pagination:
  pagerSize: 20

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: "monokai"
    lineNos: true

# Map Linny's `crdate` front-matter field to Hugo's .Date (creation time).
frontmatter:
  date:
    - crdate
    - date
    - publishDate
    - lastmod

module:
  imports:
    - path: github.com/torreirow/linny-web-theme
